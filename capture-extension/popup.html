<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Stepfilm Capture</title><style>
body{width:280px;margin:0;padding:16px;background:#10131a;color:#f4f5fb;font:14px system-ui,sans-serif}h1{font-size:18px;margin:0 0 4px}p{color:#b9bfce;line-height:1.4;margin:4px 0 14px}.mark{color:#c4f48f}input,button{width:100%;box-sizing:border-box;border-radius:8px;padding:10px;font:inherit}input{margin-bottom:9px;color:inherit;background:#181d28;border:1px solid #313747}button{cursor:pointer;border:1px solid #313747;background:#232a38;color:inherit;font-weight:700;margin-top:7px}button.primary{background:#c4f48f;color:#15200e;border-color:transparent}button:disabled{opacity:.5;cursor:wait}#count{color:#c4f48f;font-weight:700;margin:12px 0 2px}.status{min-height:20px;color:#b9bfce;font-size:12px}.error{color:#ffada5}.how{display:grid;gap:3px;padding:9px 10px;margin:10px 0;background:#181d28;border:1px solid #313747;border-radius:8px;color:#b9bfce;font-size:11px}.how b{color:#c4f48f;margin-bottom:2px}
</style></head>
<body><h1>Stepfilm <span class="mark">capture</span></h1><p>Capture one screenshot for each meaningful browser step. Nothing leaves this computer.</p><div class="how"><b>How it works</b><span>1. Start capture</span><span>2. Click through the workflow</span><span>3. Stop to edit narration</span></div><input id="title" value="Browser workflow" aria-label="Guide title"><button id="start" class="primary">Start capture</button><div id="count">0 steps</div><button id="step" disabled>Capture current step</button><button id="stop" disabled>Stop &amp; open editor</button><p id="status" class="status" role="status"></p><script src="popup.js"></script></body></html>
